[project]
name = "ai-datanalysis"
version = "0.1.4"
description = "AI-powered chatbot tool for data analysis."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Fabrício Siqueira" }
]

dependencies = [
  "numpy==1.26.4",
  "pandas>=2.2.2",
  "streamlit==1.34.0",
  "plotly==5.22.0",
  "cohere==5.3.4",
  "statsmodels==0.14.2",
  "scipy==1.13.0",
  "scikit-learn==1.4.2",
  "langchain==0.1.17",
  "langchain-community==0.0.36",
  "langchain-cohere==0.1.4",
  "langchain-google-genai==1.0.3",
  "langchain-openai==0.1.7",
  "langchain-groq==0.1.3",
  "colorama==0.4.6",
  "chromadb>=1.5.9",
  "sentence-transformers>=5.4.1",
  "kaleido==0.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
