[project]
name = "ai-datanalysis"
version = "0.1.4"
description = "AI-powered chatbot tool for data analysis."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Fabrício Siqueira" }
]

dependencies = [
  "numpy==1.26.4",
  "pandas>=2.2.2",
  "streamlit==1.34.0",
  "matplotlib>=3.8.0",
  "seaborn>=0.13.0",
  "cohere==5.3.4",
  "statsmodels==0.14.2",
  "scipy==1.13.0",
  "scikit-learn==1.4.2",
  "colorama==0.4.6",
  "chromadb>=1.5.9",
  "sentence-transformers>=5.4.1",
  "litellm>=1.83.0",
  "streamlit-ace>=0.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "deptry>=0.25.1",
]
